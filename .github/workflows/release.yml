name: PyPI Publish 

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build wheels for each OS in parallel
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: uv pip install --system maturin

      # This step is necessary for macOS arm64 builds
      - name: Set up Rust target for macOS arm64
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - name: Generate type stubs
        run: |
          cargo run --bin stub_gen

      - name: Build wheels
        run: |
          maturin build --release --sdist --strip --interpreter python
        env:
          # Build universal2 wheels on macOS
          MACOSX_DEPLOYMENT_TARGET: "10.12"
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk

      - name: List wheels
        run: |
          ls -l target/wheels/

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: target/wheels/*.whl

      - name: Upload sdist
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  # Publish once all builds are complete
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish on tag push or manual trigger
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Create dist directory
        run: mkdir -p dist

      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          path: downloaded

      - name: Move wheels to dist
        run: |
          find downloaded -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec mv {} dist/ \;

      - name: List distribution files
        run: ls -l dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish --check-url https://pypi.org/simple/ dist/*