name: Docs

on:
  push:
    branches: [master]
  # Pull requests build the site (which runs every example) but do not deploy it.
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Silence the end-of-life banners Material and its plugins print about MkDocs 2.0.
  NO_MKDOCS_2_WARNING: "1"
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: docs/requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate type stubs from Rust sources
        run: cargo run --bin stub_gen

      - name: Install docs dependencies
        run: uv pip install --system -r docs/requirements.txt

      # The gallery examples and the code blocks on the pages run during the
      # build, against pymocd built from this commit (--no-cache: uv would
      # otherwise key a local build on pyproject.toml alone).
      - name: Build and install pymocd
        run: uv pip install --system --no-cache .

      - name: Build site
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
